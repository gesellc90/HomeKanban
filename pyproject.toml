[project]
name = "homekanban"
version = "0.1.0"
description = "Kanban-Verwaltung für Alltagsverbrauchsmittel im Haushalt"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    # QR-Codes für die Etiketten (L7, ab M5): reines Python, keine C-Erweiterung und kein
    # Pillow — auf dem Raspberry Pi wird nichts kompiliert. Schreibt PNG und SVG selbst.
    "segno>=1.6",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/domain"]
